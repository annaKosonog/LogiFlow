# Automatyczne tworzenie i usuwanie struktury tabel (bez domyślnych danych)
spring.jpa.hibernate.ddl-auto=validate

# Liquibase MUSI być włączony w testach — inaczej nie testujesz swoich migracji
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/changelog.xml

spring.sql.init.mode=never
  
  # Logowanie zapytań SQL (opcjonalnie)
spring.jpa.show-sql=true
  
  # Ogranicz rozmiar puli połączeń per kontekst — przy wielu kontekstach naraz, mniejsza pula = mniej obciążenia na Postgresa
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000