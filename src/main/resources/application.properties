spring.application.name=LogiFlow
spring.datasource.url=jdbc:postgresql://localhost:1001/delivery_management_db
# Nazwa u?ytkownika do po??czenia z baz?
spring.datasource.username=root
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.jpa.hibernate.ddl-auto=update # lub create, validate, none
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.sql.init.mode=always

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/changelog.xml
spring.liquibase.default-schema=public
spring.liquibase.liquibase-schema=public

# SWAGGER http://localhost:8080/swagger-ui/index.html#/
springdoc.api-docs.path=/api-docs
